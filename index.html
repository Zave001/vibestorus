<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет боярина</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%237a1f1a' stroke='%23c9a24b' stroke-width='4'/%3E%3Cpath d='M32 14v36M18 26h28' stroke='%23c9a24b' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--wall:#2a1f1a;--wood:#4a2f1c;--wood2:#3a2415;--paper:#e8dcbf;--ink:#2b1d12;--gold:#c9a24b;--red:#c0392b;--text:#f1e6cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--wall);color:var(--text);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#room{position:relative;width:100%;height:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1.6fr 1fr;grid-template-rows:1fr auto;gap:0 14px;padding:14px}
.hud{grid-column:1;grid-row:1/3;align-self:start;display:flex;flex-direction:column;gap:8px}
.turn{font-size:15px;text-align:center;opacity:.85}
.stat{background:var(--wood2);border:2px solid var(--gold);padding:6px 12px;display:grid;grid-template-columns:1fr auto;align-items:center;font-size:16px;transition:background .3s}
.stat b{font-size:24px;font-variant-numeric:tabular-nums;text-align:right}
.stat small{grid-column:1/3;opacity:.7;font-size:12px}
.stat.low{background:#5a1612;border-color:var(--red);animation:pulse 1s infinite}
.stat.low b{color:#ff8a7a}
@keyframes pulse{50%{box-shadow:0 0 18px var(--red)}}
.wallmap{grid-column:2;grid-row:1;position:relative;min-height:0;background:var(--wood);border:6px solid var(--wood2);padding:10px;display:flex;flex-direction:column}
.wallmap h2{margin:0 0 6px;font-size:16px;font-weight:normal;text-align:center}
.wallmap svg{flex:1;min-height:0;width:100%;background:#d9c9a0}
.right{grid-column:3;grid-row:1/3;align-self:start;display:flex;flex-direction:column;gap:12px}
.flag{border:2px solid var(--gold);background:#7a1f1a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;font-size:14px;min-height:140px;color:var(--text);font-family:inherit}
.flag svg{width:70px;height:70px}
.drawer{margin-bottom:8px}
.stack{display:block;width:100%;height:44px;cursor:pointer;background:var(--paper);color:var(--ink);border:2px solid var(--ink);font:inherit;font-size:16px;text-align:center;padding:0 12px}
.stack:hover{background:#f6edd2}
.desk{grid-column:2;grid-row:2;background:linear-gradient(var(--wood),var(--wood2));border-top:4px solid var(--gold);display:flex;justify-content:space-around;align-items:flex-end;padding:14px 10px;min-height:150px}
.item{background:none;border:0;color:var(--text);font:inherit;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.item svg{width:90px;height:80px;transition:transform .15s}
.item:hover svg,.item:focus-visible svg{transform:translateY(-4px)}
.item:focus-visible,.stack:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.item.glow svg{filter:drop-shadow(0 0 10px var(--gold))}
.item.alert{outline:3px solid var(--red);outline-offset:4px;border-radius:10px;animation:pulse 1s infinite}
.tug{border:2px solid var(--gold);background:var(--wood2);padding:10px;font-size:12px}
.tug h4{margin:0 0 6px;font-size:13px;font-weight:normal;text-align:center}
.tug .ends{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;text-align:center}
.tug .ends div{display:flex;flex-direction:column;align-items:center;width:46%;gap:2px}
.tug svg{width:30px;height:30px}
.segs{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0 6px}
.seg{height:18px;background:#5a4030;border:1px solid var(--gold);position:relative}
.seg.mid{background:#7a6440}
.seg.on{background:var(--gold)}
.seg.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--red)}
.tugcap{text-align:center;opacity:.85}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:8px 14px;border:2px solid var(--ink);opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%;text-align:center;z-index:5}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(10,6,3,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.card{background:var(--paper);color:var(--ink);max-width:600px;width:100%;max-height:92%;overflow:auto;padding:22px;border:3px double var(--ink);line-height:1.5}
.card h3{margin:0 0 4px;font-size:22px}
.card .yr{opacity:.65;margin:0 0 10px}
.card p{margin:0 0 12px;max-width:60ch}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;background:#f6edd2;border:2px solid var(--ink);font:inherit;color:var(--ink);cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--gold);outline:none}
.stat>span i{display:inline-block;margin-left:4px;vertical-align:middle;font-style:normal}
.stat>span i svg{width:16px;height:16px;margin-left:3px;vertical-align:middle}
.dl{font-style:normal;font-size:13px;margin-left:6px;font-weight:bold;display:inline-block}
.dl.pos{color:#7fd67f;animation:pop .8s ease-out}
.dl.neg{color:#ff7a6a;animation:pop .8s ease-out}
@keyframes pop{0%{transform:scale(1.9);opacity:0}50%{opacity:1}100%{transform:scale(1)}}
.opt.lock{opacity:.6;cursor:not-allowed}
.opt.lock:hover{background:#f6edd2}
.opt .tip{display:none;margin-top:4px;color:#8a2f26;opacity:1}
.opt.lock:hover .tip,.opt.lock:focus-visible .tip{display:block}
.opt svg.lk{width:16px;height:16px;vertical-align:-2px;margin-right:6px}
.seg{font-size:10px;line-height:16px;text-align:center;color:var(--text)}
.seg.on{color:var(--ink);font-weight:bold;outline:2px solid var(--red);z-index:1}
.seg.on::after{content:none}
.scn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.sc{padding:14px;border:2px solid var(--ink);background:#f6edd2;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.sc:hover:not(.lock),.sc:focus-visible:not(.lock){background:var(--gold);outline:none}
.sc b{display:block;font-size:19px;margin-bottom:6px}
.sc small{display:block;opacity:.85}
.sc.lock{opacity:.6;cursor:not-allowed}
.sc svg.lk{width:22px;height:22px;vertical-align:-4px;margin-right:6px}
@media(max-width:520px){.scn{grid-template-columns:1fr}}
.frow{display:flex;gap:10px}
.frow .flag{flex:1;min-width:0;aspect-ratio:1/1;min-height:0;padding:4px}
.frow .flag svg{width:56%;height:auto}
.icon{flex:1;min-width:0;aspect-ratio:1/1;border:2px solid var(--gold);background:#1a120c;padding:4px;cursor:pointer;display:block}
.icon{position:relative}
.icon.hl{outline:3px solid var(--gold);outline-offset:3px;animation:pulseg 1s infinite}
.stat[role=button]{cursor:pointer}
.stat[role=button]:hover,.stat[role=button]:focus-visible{background:#4a2f1c;outline:none}
.stat.pat{cursor:pointer}
.stat.pat:hover,.stat.pat:focus-visible{background:#4a2f1c;outline:none}
.ib{position:absolute;right:4px;bottom:4px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:bold;padding:0 6px;border:1px solid var(--ink)}
.icon:hover,.icon:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.icon svg{width:100%;height:100%;display:block}
.item.nudge{outline:3px solid var(--gold);outline-offset:4px;border-radius:10px;animation:pulseg 1s infinite}
@keyframes pulseg{50%{box-shadow:0 0 18px var(--gold)}}
.opt.sel{background:var(--gold);border-color:var(--red)}
.opt:disabled{opacity:.4;cursor:not-allowed;background:#f6edd2}
.close{margin-top:8px;padding:8px 14px;font:inherit;background:var(--ink);color:var(--paper);border:0;cursor:pointer}
.sig{text-align:right;font-style:italic;opacity:.8}
.guide li{margin-bottom:10px;padding:4px 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.tile{padding:10px;border:2px solid var(--ink);background:#f6edd2;font:inherit;color:var(--ink);text-align:left;cursor:default}
.tile.on{background:#e7b3a8;border-color:var(--red)}
.tile.click{cursor:pointer}
.tile b{display:block;margin-bottom:4px}
.tile small{display:block;margin-top:6px;opacity:.8}
@media(max-width:720px){
 #room{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;overflow:auto;gap:10px 14px}
 body{overflow:auto}
 .hud{grid-column:1;grid-row:1}.right{grid-column:2;grid-row:1}
 .wallmap{grid-column:1/3;grid-row:2;min-height:220px}
 .desk{grid-column:1/3;grid-row:3}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="room">
 <div class="hud">
  <div class="turn" id="turn"></div>
  <div class="stat" id="sM" role="button" tabindex="0" title="Показать, из чего складывается прирост"><span>Золото<i id="iM"></i></span><b><span id="vM"></span><em class="dl" id="dM"></em></b><small id="rM"></small></div>

 </div>

  Флаг
 </div>
 <button class="icon" id="icon" aria-label="Икона"></button></div>
 <div class="stat pat" id="patbox" role="button" tabindex="0" title="Выбрать икону"><span>Авторитет Патриарха</span><b><span id="vP"></span><em class="dl" id="dP"></em></b></div>
 <div class="tug"><h4>Перетягивание каната</h4>
  <div class="ends">
   <div><svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#c9a24b" stroke="#2b1d12" stroke-width="1"><rect x="2" y="3" width="12" height="12" transform="rotate(-8 8 9)"/><rect x="18" y="1" width="12" height="12" transform="rotate(10 24 7)"/><rect x="1" y="19" width="12" height="12" transform="rotate(6 7 25)"/><rect x="19" y="19" width="12" height="12" transform="rotate(-12 25 25)"/></g></svg>Раздробленность</div>

  </div>
  <div class="segs" id="segs"></div><div class="tugcap" id="tugcap"></div>
 </div>
</div>
 <div class="desk">
  <button class="item" id="candle">
   <svg viewBox="0 0 90 80"><rect x="40" y="30" width="10" height="38" fill="#e8dcbf"/><path d="M45 14c-6 8-3 14 0 16 3-2 6-8 0-16z" fill="#f2b94a"/><rect x="28" y="68" width="34" height="6" fill="#c9a24b"/></svg>
   Модификаторы
  </button>

   <svg viewBox="0 0 90 80"><path d="M8 18 Q27 10 45 20 Q63 10 82 18 V66 Q63 58 45 68 Q27 58 8 66Z" fill="#e8dcbf" stroke="#2b1d12" stroke-width="2"/><path d="M45 20V68" stroke="#2b1d12" stroke-width="2"/></svg>

  </button>

   <span id="inkL">Чернильница</span>

 </div>
 <div id="toast" role="status"></div>
</div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
// Событие: [год, заголовок, текст, [вариант: [текст, деньги, крепостные, авторитет, исторически верный(1/0)]]]

["1462","Присяга новому князю","Умер Василий Тёмный. На престол вступает двадцатидвухлетний Иван III и ждёт подтверждения службы от бояр.",[
["Принести присягу и подтвердить службу",5,5,5,1],["Затянуть с присягой, выжидая",0,0,-5,0],["Поддержать притязания дальнего родича",5,5,-25,0],["Откупиться дарами вместо клятвы",-20,-20,10,0]]],
["1463","Ярославские князья уступают права","Ярославские князья уступают свои права Москве. Великий князь ждёт от московских бояр поддержки присоединения.",[
["Поддержать присоединение и принять ярославцев в службу",-10,10,10,1],["Искать покровительства Литвы",10,10,-15,0],["Скупать земли ярославцев за свой счёт",-25,20,-5,0],["Не вмешиваться",0,0,-10,0]]],
["1467","Казанский поход","Москва воюет с Казанским ханством (1467–1469). Великий князь требует людей в рать.",[

["1472","Брак с Софьей Палеолог","Великий князь женится на племяннице последнего византийского императора. При дворе шепчутся о греках и итальянцах.",[

["1476","Дань Орде","Хан Ахмат требует дани. Москва перестаёт платить: Орда слабеет, но возможен набег.",[

["1478","Судьба новгородского веча","После походов 1477–1478 Новгород теряет самостоятельность. Князь советуется с боярами, что делать с вечем и вечевым колоколом.",[
